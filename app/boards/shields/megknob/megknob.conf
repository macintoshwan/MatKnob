# USB
CONFIG_ZMK_USB=y
CONFIG_USB_DEVICE_STACK=y

# 0.91-inch 128x32 SSD1306 OLED on the pro-micro I2C bus.
# ZMK's built-in status screen reports active layer, output/profile and
# battery state.  These options mirror what every other SSD1306 shield in
# the tree (Sofle, Kyria, Leeloo, Snap, etc.) sets; without CONFIG_I2C
# and CONFIG_SSD1306 the device-tree node is present but the driver never
# binds, leaving the display subsystem in a half-initialised state that
# blocked the shared system work queue and took USB/BLE/keyboard down
# with it (the "all-yellow OLED + unsupported USB device" regression).
CONFIG_ZMK_DISPLAY=y
CONFIG_I2C=y
CONFIG_SSD1306=y

# 1-bit monochrome OLED: standard ZMK LVGL profile for SSD1306.
CONFIG_LV_Z_VDB_SIZE=64
CONFIG_LV_DPI_DEF=148
CONFIG_LV_Z_BITS_PER_PIXEL=1
CONFIG_LV_COLOR_DEPTH_1=y

# Isolate display refresh on its own work queue so a slow / stuck I2C
# transfer can no longer starve USB HID, BLE, or the kscan loop.
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=4096
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_PRIORITY=5

# Hall voltage telemetry over a dedicated USB CDC ACM port (see
# app/module/lib/hall_telemetry and the megknob.overlay
# zmk,hall-telemetry-uart chosen node). This is a rebuild of the CDC data
# link that was removed in 4113e8ba to stabilize BLE (see the 2026-07-23 dev
# log): the new implementation only ever pushes into a bounded queue with
# K_NO_WAIT from the kscan_adc_mux scan loop and does all USB I/O on its own
# K_LOWEST_APPLICATION_THREAD_PRIO thread, so it should not repeat that
# regression -- but treat BLE/HID stability as the higher priority if
# anything regresses after enabling this.
CONFIG_HALL_TELEMETRY=y

# Bluetooth
CONFIG_ZMK_BLE=y
CONFIG_BT=y
CONFIG_BT_CTLR_PHY_2M=n
CONFIG_SETTINGS=y
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=1000

# Persistent settings storage
CONFIG_FLASH=y
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y
CONFIG_FLASH_MAP=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y

# Battery: show the actual charge percentage and USB charging state on OLED.
# nice!nano supplies the battery node, so this remains independent of the
# Hall ADC mux used by MegKnob.
CONFIG_ZMK_BATTERY_REPORTING=y
# nice!nano v1/v2 expose voltage rather than a fuel-gauge percentage.
CONFIG_ZMK_BATTERY_REPORTING_FETCH_MODE_LITHIUM_VOLTAGE=y

# MegKnob uses a compact ASCII-only custom 128x32 status page. It displays
# USB/BLE/profile/connection, active layer, battery percentage, and WPM
# without optional LVGL symbol glyphs that render as hollow squares on this OLED.
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_LV_FONT_MONTSERRAT_12=y
CONFIG_LV_USE_LABEL=y
CONFIG_ZMK_WPM=y

# RGB underglow / WS2812 test
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=0
CONFIG_ZMK_RGB_UNDERGLOW_SAT_START=100
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=35
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=85
CONFIG_ZMK_RGB_UNDERGLOW_SPD_START=5
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=3

# 4051 address pins on nRF52840 NFC-capable pins P0.09/P0.10
CONFIG_NFCT_PINS_AS_GPIOS=y

# Wheel rotation quadrature encoder (see wheel_encoder in megknob.overlay).
# Replaces the previous (electrically incorrect) model of treating the A/B
# phases as two independent matrix keys.
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Extra safety margin for the kscan event queue. The ADC mux Hall driver now
# debounces internally (see kscan_adc_mux.c / megknob.overlay debounce-*-ms),
# so this should rarely if ever fill up, but a slightly larger queue costs
# almost nothing and protects against transient bursts (e.g. rapid wheel +
# key combos) being dropped and desyncing a press/release pair, which is what
# was causing modifiers to appear stuck.
CONFIG_ZMK_KSCAN_EVENT_QUEUE_SIZE=16

# Sleep (disabled - same as Sweep-Pro)
CONFIG_ZMK_SLEEP=n

# Soft off
CONFIG_ZMK_PM_SOFT_OFF=y

