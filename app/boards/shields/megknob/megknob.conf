# Composite USB device: ZMK HID keyboard plus Hall telemetry/config CDC ACM.
CONFIG_ZMK_USB=y
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_CDC_ACM=y
CONFIG_SERIAL=y
CONFIG_UART_LINE_CTRL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_TIMING_FUNCTIONS=y

# Quadrature encoder. Verify A/B direction and detent count on hardware.
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Keep both transports available: USB HID + CDC telemetry and BLE HID.
CONFIG_ZMK_BLE=y
CONFIG_BT=y
CONFIG_BT_CTLR=y
CONFIG_SETTINGS=y
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=1000

# Persistent settings storage
CONFIG_FLASH=y
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y
CONFIG_FLASH_MAP=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y

# Battery reporting is available to BLE hosts.
CONFIG_ZMK_BATTERY_REPORTING=y

# RGB underglow / WS2812 test
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=0
CONFIG_ZMK_RGB_UNDERGLOW_SAT_START=100
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=35
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=85
CONFIG_ZMK_RGB_UNDERGLOW_SPD_START=5
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=3

# 4051 address pins on nRF52840 NFC-capable pins P0.09/P0.10
CONFIG_NFCT_PINS_AS_GPIOS=y

# Sleep (disabled - same as Sweep-Pro)
CONFIG_ZMK_SLEEP=n

# Soft off
CONFIG_ZMK_PM_SOFT_OFF=y
