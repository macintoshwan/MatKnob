description: ADC keyboard mux controller

compatible: "zmk,kscan-adc-mux"

include: kscan.yaml

properties:
  address-gpios:
    type: phandle-array
    required: true
    description: 4051 address pins, ordered from least significant bit to most significant bit.

  io-channels:
    type: phandle-array
    required: true
    description: ADC inputs connected to the mux common pins.

  polling-interval-ms:
    type: int
    default: 5

  settle-time-us:
    type: int
    default: 20

  press-threshold-mv:
    type: int
    required: true

  release-threshold-mv:
    type: int
    required: true

  press-is-greater:
    type: boolean
    description: Treat voltages greater than the press threshold as pressed.

  debounce-press-ms:
    type: int
    default: 5
    description: >
      Debounce time for key press in milliseconds. Because analog Hall
      readings can hover right at the press/release threshold (bounce/noise
      near the flip point), each channel must report the same instantaneous
      state for this many milliseconds of consecutive scans before the press
      is latched and forwarded to the callback.

  debounce-release-ms:
    type: int
    default: 5
    description: >
      Debounce time for key release in milliseconds, using the same
      consecutive-scan confirmation algorithm as debounce-press-ms.
